language: "ko-KR"

early_access: true
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  commit_status: true
  poem: false
  collapse_walkthrough: true
  changed_files_summary: true
  labeling_instructions: []

  path_instructions:
    - path: "**/*.tsx"
      instructions: >
        ### 컴포넌트 파일
        - 컴포넌트 파일(.tsx)은 PascalCase를 사용해야 합니다.
        - 파일명과 컴포넌트 변수명이 반드시 일치해야 합니다.
        - 컴포넌트는 반드시 화살표 함수로 작성해야 합니다.

        ### 페이지 파일 (page, layout 등)
        - "use client" 지시어가 없는 페이지: 소문자 `page`로 선언해야 합니다.
          올바른 예: const page = () => { return <div>Hello World</div>; }; export default page;
        - "use client" 지시어가 있는 페이지: 대문자 `Page`로 선언해야 합니다.
          올바른 예: const Page = () => { return <div>Hello World</div>; }; export default Page;
        - `export default function Page()` 형식은 사용하지 않는다.

        ### TailwindCSS
        - 조건부 클래스 문자열을 직접 이어붙이는 경우 cn() 유틸리티 사용을 제안해주세요.
        - 인라인 style 속성보다 Tailwind 클래스 사용을 권장해주세요.

    - path: "**/*.ts"
      instructions: >
        - 파일명은 소문자로 시작하는 camelCase를 사용해야 합니다.
        - 함수, 변수명은 소문자로 시작하는 camelCase를 사용해야 합니다.

  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false

  tools:
    eslint:
      enabled: true
    github-checks:
      enabled: true
    gitleaks:
      enabled: true
    biome:
      enabled: false
    shellcheck:
      enabled: false
