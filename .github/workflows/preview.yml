name: Preview

on:
  pull_request:
    branches: ["main"]

jobs:
  vercel-preview:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest && npm install --global pnpm@10.29.2
      - name: Get Vercel Environment Variables
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy

        run: |

          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} > vercel-output.txt
          echo "preview_url=$(cat vercel-output.txt)" >> $GITHUB_OUTPUT

      - name: Comment PR with Preview URL
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ✅ PREVIEW ${{ steps.deploy.outputs.preview_url }}

  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@10.29.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.ditda.kr

      - name: Start app on localhost:3000
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done

      - name: Install Puppeteer (for authenticated designer/instructor runs)
        # node_modules is already pnpm-managed from the earlier install step;
        # `npm install` there corrupts it (npm error: Cannot read properties of null
        # (reading 'matches')), so use pnpm here too.
        run: pnpm add --save-dev puppeteer

      - name: Generate per-role Lighthouse configs
        run: |
          cat > designer.lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "url": [
                  "http://localhost:3000/designer",
                  "http://localhost:3000/designer/search",
                  "http://localhost:3000/designer/my"
                ],
                "puppeteerScript": ".github/lighthouse/login.js",
                "puppeteerLaunchOptions": {
                  "args": ["--no-sandbox", "--disable-setuid-sandbox"]
                }
              }
            }
          }
          EOF
          cat > instructor.lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "url": [
                  "http://localhost:3000/instructor",
                  "http://localhost:3000/instructor/write",
                  "http://localhost:3000/instructor/my"
                ],
                "puppeteerScript": ".github/lighthouse/login.js",
                "puppeteerLaunchOptions": {
                  "args": ["--no-sandbox", "--disable-setuid-sandbox"]
                }
              }
            }
          }
          EOF

      - name: Run Lighthouse (landing, public)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:3000/
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-public
          temporaryPublicStorage: true

      - name: Preserve public results
        if: always()
        run: |
          mv .lighthouseci lhci-public || exit 0
          sed -i "s#/\.lighthouseci/#/lhci-public/#g" lhci-public/manifest.json || true

      - name: Run Lighthouse (designer, authenticated)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_USERNAME: ${{ secrets.LHCI_TEST_DESIGNER_USERNAME }}
          LHCI_PASSWORD: ${{ secrets.LHCI_TEST_DESIGNER_PASSWORD }}
        with:
          configPath: designer.lighthouserc.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-designer
          temporaryPublicStorage: true

      - name: Preserve designer results
        if: always()
        run: |
          mv .lighthouseci lhci-designer || exit 0
          sed -i "s#/\.lighthouseci/#/lhci-designer/#g" lhci-designer/manifest.json || true

      - name: Run Lighthouse (instructor, authenticated)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_USERNAME: ${{ secrets.LHCI_TEST_INSTRUCTOR_USERNAME }}
          LHCI_PASSWORD: ${{ secrets.LHCI_TEST_INSTRUCTOR_PASSWORD }}
        with:
          configPath: instructor.lighthouserc.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-instructor
          temporaryPublicStorage: true

      - name: Preserve instructor results
        if: always()
        run: |
          mv .lighthouseci lhci-instructor || exit 0
          sed -i "s#/\.lighthouseci/#/lhci-instructor/#g" lhci-instructor/manifest.json || true

      - name: Format Lighthouse results
        id: format
        if: always()
        run: node .github/lighthouse/format-results.js

      - name: Comment PR with Lighthouse results
        if: always()
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: lighthouse
          message: ${{ steps.format.outputs.comment }}

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write
  issues: write
  pull-requests: write
